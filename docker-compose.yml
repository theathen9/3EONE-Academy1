# ./docker-compose.yml
services:
    # Web Server (Nginx)
    web:
        image: nginx:alpine
        container_name: laravel_web1
        restart: unless-stopped
        ports:
            - "8080:80"
        volumes:
            - .:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
            - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
        depends_on:
            - app
        networks:
            - laravel_network

    # Application (PHP-FPM)
    app:
        build:
            context: .
            dockerfile: ./docker/php/Dockerfile
        container_name: laravel_app1
        restart: unless-stopped
        volumes:
            - .:/var/www/html
            - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom-php.ini
            - ./docker/php/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini
        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            DB_CONNECTION: pgsql
            DB_HOST: db
            DB_PORT: 5432
            DB_DATABASE: laravel
            DB_USERNAME: laravel_user
            DB_PASSWORD: secret_password
            REDIS_HOST: redis
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_started
        networks:
            - laravel_network

    # PostgreSQL Database
    db:
        image: postgres:16-alpine
        container_name: laravel_db1
        restart: unless-stopped
        environment:
            POSTGRES_DB: laravel
            POSTGRES_USER: laravel_user
            POSTGRES_PASSWORD: secret_password
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U laravel_user -d laravel"]
            interval: 5s
            timeout: 5s
            retries: 5
        networks:
            - laravel_network

    # Redis Cache
    redis:
        image: redis:alpine
        container_name: laravel_redis1
        restart: unless-stopped
        ports:
            - "6380:6379"
        networks:
            - laravel_network

volumes:
    postgres_data:
        driver: local

networks:
    laravel_network:
        driver: bridge
