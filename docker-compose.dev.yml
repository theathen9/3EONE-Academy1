services:
  # ------------------------------------------------------------
  # Laravel App - Development
  # ------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile.dev
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}

    container_name: laravel_dev_app

    entrypoint: []

    command:
      - php-fpm
      - -F

    volumes:
      # Live source code
      - ./:/var/www/html

      # Keep runtime data in Docker volumes
      - storage_data_dev:/var/www/html/storage
      - storage_public_dev:/var/www/html/storage/app/public

    env_file:
      - .env

    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      CONTAINER_ROLE: app

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "cgi-fcgi -bind -connect 127.0.0.1:9000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

    networks:
      - laravel_dev_network

  # ------------------------------------------------------------
  # Nginx - Development
  # ------------------------------------------------------------
  web:
    image: nginx:alpine

    container_name: laravel_dev_web

    ports:
      - "80:80"

    volumes:
      - ./:/var/www/html:ro

      - storage_public_dev:/var/www/html/storage/app/public:ro

      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      app:
        condition: service_healthy

    networks:
      - laravel_dev_network

  # ------------------------------------------------------------
  # PostgreSQL
  # ------------------------------------------------------------
  db:
    image: postgres:16-alpine

    container_name: laravel_dev_db

    environment:
      POSTGRES_DB: ${DB_DATABASE:-laravel}
      POSTGRES_USER: ${DB_USERNAME:-laravel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}

    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-laravel} -d ${DB_DATABASE:-laravel}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - laravel_dev_network

  # ------------------------------------------------------------
  # Redis
  # ------------------------------------------------------------
  redis:
    image: redis:alpine

    container_name: laravel_dev_redis

    command:
      - redis-server

    volumes:
      - redis_dev_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

    networks:
      - laravel_dev_network

volumes:
  postgres_dev_data:
  redis_dev_data:
  storage_data_dev:
  storage_public_dev:

networks:
  laravel_dev_network:
    driver: bridge
