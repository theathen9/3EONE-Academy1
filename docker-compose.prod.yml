services:
  # ------------------------------------------------------------
  # Web Server (Nginx)
  # ------------------------------------------------------------
  web:
    image: nginx:alpine
    container_name: laravel_prod_web1
    restart: always

    ports:
      - "80:80"
    volumes:
      # Laravel public directory
      - public_data:/var/www/html/public:ro

      # Publicly accessible storage files
      - storage_public:/var/www/html/storage/app/public:ro

      # Nginx configuration
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      app:
        condition: service_healthy

    networks:
      - laravel_prod_network1

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ------------------------------------------------------------
  # Main Application (PHP-FPM)
  # ------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile.prod
      target: production
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}

    container_name: laravel_prod_app1
    restart: always

    entrypoint:
      - /usr/local/bin/docker-entrypoint.sh

    command:
      - php-fpm

    volumes:
      - storage_data:/var/www/html/storage
      - storage_public:/var/www/html/storage/app/public
      - public_data:/var/www/html/public

    env_file:
      - .env.production

    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      CONTAINER_ROLE: app

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "cgi-fcgi -bind -connect 127.0.0.1:9000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

    networks:
      - laravel_prod_network1

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ------------------------------------------------------------
  # Laravel Queue Worker
  # ------------------------------------------------------------
  queue:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile.prod
      target: production
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}

    container_name: laravel_prod_queue1
    restart: always

    entrypoint:
      - /usr/local/bin/docker-entrypoint.sh

    command:
      - php
      - artisan
      - queue:work
      - --sleep=3
      - --tries=3
      - --max-time=3600

    volumes:
      - storage_data:/var/www/html/storage
      - storage_public:/var/www/html/storage/app/public

    env_file:
      - .env.production

    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      CONTAINER_ROLE: queue

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - laravel_prod_network1

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ------------------------------------------------------------
  # Laravel Task Scheduler
  # ------------------------------------------------------------
  scheduler:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile.prod
      target: production
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}

    container_name: laravel_prod_scheduler1
    restart: always

    entrypoint:
      - /usr/local/bin/docker-entrypoint.sh

    command:
      - php
      - artisan
      - schedule:work

    volumes:
      - storage_data:/var/www/html/storage
      - storage_public:/var/www/html/storage/app/public

    env_file:
      - .env.production

    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      CONTAINER_ROLE: scheduler

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - laravel_prod_network1

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ------------------------------------------------------------
  # PostgreSQL Database
  # ------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: laravel_prod_db1
    restart: always

    environment:
      POSTGRES_DB: ${DB_DATABASE:-laravel_prod_db}
      POSTGRES_USER: ${DB_USERNAME:-laravel_prod_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_prod_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-laravel_prod_user} -d ${DB_DATABASE:-laravel_prod_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - laravel_prod_network1

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ------------------------------------------------------------
  # Redis Cache & Queue Backend
  # ------------------------------------------------------------
  redis:
    image: redis:alpine
    container_name: laravel_prod_redis1
    restart: always

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}

    volumes:
      - redis_prod_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

    networks:
      - laravel_prod_network1

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# ------------------------------------------------------------
# Volumes
# ------------------------------------------------------------
volumes:
  postgres_prod_data:
    driver: local

  redis_prod_data:
    driver: local

  storage_data:
    driver: local

  storage_public:
    driver: local

  public_data:
    driver: local

# ------------------------------------------------------------
# Networks
# ------------------------------------------------------------
networks:
  laravel_prod_network1:
    driver: bridge
